[project]
name = "dyad-rl"
version = "0.1.0"
description = "Dyad RL — Collaborative Reinforcement Learning on Logic Puzzles"
readme = "README.md"
authors = [{ name = "fleer" }, { name = "abarch" }]
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.19.2",
  "hydra-core>=1.3.6",
  "hydra-optuna-sweeper>=1.2.0",
  "ipython",
  "jupyter",
  "matplotlib>=3.11.1",
  "notebook",
  "optuna>=2.10.1",
  "optuna-dashboard>=0.14.0",
  "rlp",
  "tqdm",
]

[project.optional-dependencies]
amd = ["torch", "torchvision"]
cpu = ["torch", "torchvision"]
cuda = ["torch", "torchvision"]

[tool.uv.sources]
rlp = { path = "puzzle_env" }
torch = [
  { index = "pytorch-amd", extra = "amd" },
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cuda", extra = "cuda" },
]
torchvision = [
  { index = "pytorch-amd", extra = "amd" },
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-amd"
url = "https://download.pytorch.org/whl/rocm7.14"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[tool.uv]
conflicts = [[{ "extra" = "amd" }, { "extra" = "cuda" }, { "extra" = "cpu" }]]
