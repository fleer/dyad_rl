# Optuna sweep config for dyad learning hyperparameter optimization.
#
# Usage:
#   python experiment.py --multirun --config-name=sweep_dyad
#   python experiment.py --multirun --config-name=sweep_dyad env=netslide_3x3
#
defaults:
  - default
  - override /env: netslide_2x3
  - override /training: dyad
  - override hydra/sweeper: optuna
  - _self_

experiment_name: sweep_dyad

agent_a:
  type: mlp
  net_arch: [128, 128]
  batch_size: 128
  gamma: 0.99
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05
  exploration_decay: 100000
  tau: 1.0
  learning_rate: 1.0e-4
  buffer_size: 50000
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 10000
  max_grad_norm: 10

agent_b:
  type: cnn
  conv_channels: [32, 64, 64]
  conv_kernels: [8, 4, 3]
  conv_strides: [4, 2, 1]
  fc_hidden: 512
  batch_size: 128
  gamma: 0.99
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05
  exploration_decay: 100000
  tau: 1.0
  learning_rate: 1.0e-4
  buffer_size: 50000
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 10000
  max_grad_norm: 10

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
    direction: maximize
    n_trials: 50
    n_jobs: 1
    search_space:
      agent_a.learning_rate:
        type: float
        low: 1e-5
        high: 1e-3
        log: true
      agent_b.learning_rate:
        type: float
        low: 1e-5
        high: 1e-3
        log: true
      agent_a.gamma:
        type: float
        low: 0.95
        high: 0.999
      agent_b.gamma:
        type: float
        low: 0.95
        high: 0.999
      agent_a.batch_size:
        type: categorical
        choices: [32, 64, 128, 256]
      agent_b.batch_size:
        type: categorical
        choices: [32, 64, 128, 256]
      agent_a.exploration_decay:
        type: categorical
        choices: [5000, 10000, 20000, 50000, 100000]
      agent_b.exploration_decay:
        type: categorical
        choices: [5000, 10000, 20000, 50000, 100000]
      agent_a.tau:
        type: categorical
        choices: [0.05, 0.1, 0.5, 1.0]
      agent_b.tau:
        type: categorical
        choices: [0.05, 0.1, 0.5, 1.0]
      agent_a.target_update_interval:
        type: categorical
        choices: [2500, 5000, 10000, 20000]
      agent_b.target_update_interval:
        type: categorical
        choices: [2500, 5000, 10000, 20000]
      training.share_interval:
        type: categorical
        choices: [10, 25, 50, 100]
      training.rating_threshold:
        type: float
        low: -1.0
        high: 1.0
