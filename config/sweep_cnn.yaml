# Optuna sweep config for CNN DQN hyperparameter optimization.
#
# Usage:
#   python experiment.py --multirun --config-name=sweep_cnn
#   python experiment.py --multirun --config-name=sweep_cnn env=netslide_3x3
#
defaults:
  - default
  - override /env: netslide_2x3
  - override /agent: cnn
  - override /training: dqn
  - override hydra/sweeper: optuna
  - _self_

experiment_name: sweep_cnn

env:
  obs_type: rgb

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
    direction: maximize
    n_trials: 50
    n_jobs: 1
    search_space:
      training.lr:
        type: float
        low: 1e-5
        high: 1e-3
        log: true
      training.gamma:
        type: float
        low: 0.95
        high: 0.999
      training.batch_size:
        type: categorical
        choices: [32, 64, 128, 256]
      training.eps_decay:
        type: categorical
        choices: [5000, 10000, 20000, 50000]
      training.tau:
        type: float
        low: 1e-4
        high: 0.05
        log: true
      training.buffer_size:
        type: categorical
        choices: [10000, 50000, 100000]
      agent.fc_hidden:
        type: categorical
        choices: [128, 256, 512]
