# @package _global_
defaults:
  - override /env: netslide_2x3
  - override /training: dyad

# Agent A uses MLP on discrete state, Agent B uses CNN on RGB pixels.
# Both obs types are captured in every transition for cross-modality sharing.
agent_a:
  type: mlp
  net_arch: [64, 64, 64]
  batch_size: 32
  gamma: 0.99
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05
  exploration_fraction: 0.1
  tau: 1.0
  learning_rate: 1.0e-4
  buffer_size: 250000
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 10000
  max_grad_norm: 10
  replay_buffer_type: her  # standard | her
  her_n_sampled_goal: 4
  her_goal_selection_strategy: future  # future | final | episode
  her_goal_tolerance: 1.0e-6

agent_b:
  type: cnn
  conv_channels: [32, 64, 64]
  conv_kernels: [8, 4, 3]
  conv_strides: [4, 2, 1]
  fc_hidden: 512
  batch_size: 32
  gamma: 0.99
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05
  exploration_fraction: 0.1
  tau: 1.0
  learning_rate: 1.0e-4
  buffer_size: 250000
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 10000
  max_grad_norm: 10
  replay_buffer_type: her  # standard | her
  her_n_sampled_goal: 4
  her_goal_selection_strategy: future  # future | final | episode
  her_goal_tolerance: 1.0e-6

experiment_name: dyad
