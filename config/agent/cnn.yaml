type: cnn
conv_channels: [32, 64, 64]
conv_kernels: [8, 4, 3]
conv_strides: [4, 2, 1]
fc_hidden: 512
batch_size: 32
gamma: 0.99
eps_start: 0.9
eps_end: 0.05
eps_decay: 250000
tau: 0.05
lr: 1.0e-4
buffer_size: 250000
replay_buffer_type: her  # standard | her
her_n_sampled_goal: 4
her_goal_selection_strategy: future  # future | final | episode
her_goal_tolerance: 1.0e-6
