# Optuna sweep config for MLP DQN hyperparameter optimization.
#
# Usage:
#   python experiment.py --multirun --config-name=sweep_mlp
#   python experiment.py --multirun --config-name=sweep_mlp env=netslide_3x3
#
defaults:
  - default
  - override /env: netslide_2x3
  - override /agent: mlp
  - override /training: dqn
  - override hydra/sweeper: optuna
  - _self_

experiment_name: sweep_mlp
training:
  total_episodes: 10000

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
    direction: maximize
    n_trials: 50
    n_jobs: 1
    search_space:
      agent.learning_rate:
        type: float
        low: 1e-5
        high: 1e-3
        log: true
      agent.gamma:
        type: float
        low: 0.95
        high: 0.999
      agent.batch_size:
        type: categorical
        choices: [32, 64, 128, 256]
      agent.exploration_decay:
        type: categorical
        choices: [5000, 10000, 20000, 50000, 100000]
      agent.hidden_size:
        type: categorical
        choices: [32, 64, 128, 256]
      agent.num_layers:
        type: categorical
        choices: [2, 3, 4]
      agent.tau:
        type: categorical
        choices: [0.05, 0.1, 0.5, 1.0]
      agent.target_update_interval:
        type: categorical
        choices: [2500, 5000, 10000, 20000]
      agent.buffer_size:
        type: categorical
        choices: [10000, 50000, 100000]
